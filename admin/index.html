<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PizKTruck Admin — Iniciar sesión</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <h1>PizKTruck Admin</h1>
    <p>Inicia sesión para gestionar tus restaurantes</p>
    <div class="error-msg" id="errorMsg"></div>
    <label>Email</label>
    <input type="email" id="email" placeholder="tu@email.com">
    <label>Contraseña</label>
    <input type="password" id="password" placeholder="••••••••">
    <button class="btn-primary" onclick="iniciarSesion()">Entrar</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script>
async function verificarSesion(){
  const { data } = await supabaseClient.auth.getSession();
  if(data.session) window.location.href = "panel.html";
}
verificarSesion();

async function iniciarSesion(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.textContent = "";

  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error){
    errorMsg.textContent = "Email o contraseña incorrectos.";
    return;
  }
  window.location.href = "panel.html";
}
</script>
</body>
</html>
